<mat-card
  class="fruit-card"
  appearance="outlined"
  [style.--fruit-color]="accentColor"
  [attr.aria-label]="'Ver detalles de ' + fruit.nombreComun"
  (click)="requestDetails()"
>
  <img
    class="fruit-image"
    [src]="fruit.imagen || '/images/fruit-hero.png'"
    [alt]="'Imagen de ' + fruit.nombreComun"
  />

  <mat-card-header>
    <mat-card-title>{{ fruit.nombreComun }}</mat-card-title>
    <mat-card-subtitle>{{ fruit.nombreCientifico }}</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <p class="fruit-region">{{ fruit.region }}</p>
    <p class="fruit-provinces">
      <span>Provincias</span>
      {{ fruit.provincias.length ? fruit.provincias.join(', ') : 'Sin provincias registradas' }}
    </p>
  </mat-card-content>
</mat-card>
