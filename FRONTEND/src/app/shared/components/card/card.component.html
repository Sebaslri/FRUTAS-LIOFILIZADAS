<mat-card
  class="fruit-card"
  [class.fruit-card-selected]="isSelected"
  [class.fruit-card-selectable]="mixMode"
  appearance="outlined"
  [style.--fruit-color]="accentColor"
  [attr.aria-label]="'Ver detalles de ' + fruit.nombreComun"
  (click)="requestDetails()"
>
  <div class="fruit-image-container">
    <img
      class="fruit-image"
      [src]="fruit.imagen || '/images/fruit-hero.png'"
      [alt]="'Imagen de ' + fruit.nombreComun"
    />
    @if (isSelected) {
      <div class="selection-overlay">
        <mat-icon fontSet="material-symbols-outlined">check_circle</mat-icon>
      </div>
    }
  </div>

  <mat-card-header>
    <div style="display: flex; flex-direction: column; align-items: flex-start; width: 100%; gap: 0.25rem;">
      <div>
        <mat-card-title>{{ fruit.nombreComun }}</mat-card-title>
        <mat-card-subtitle>{{ fruit.nombreCientifico }}</mat-card-subtitle>
      </div>
      @if (badgeValue) {
        <span class="card-badge" style="margin-top: 0.25rem; font-size: 0.8rem; padding: 0.2rem 0.5rem; background: var(--fruit-color, #e0e0e0); color: #fff; border-radius: 4px; font-weight: 500;">
          {{ badgeValue }}
        </span>
      }
    </div>
  </mat-card-header>

  <mat-card-content>
    <p class="fruit-region">{{ fruit.region }}</p>
    <p class="fruit-provinces">
      <span>Provincias</span>
      {{ fruit.provincias.length ? fruit.provincias.join(', ') : 'Sin provincias registradas' }}
    </p>
  </mat-card-content>
</mat-card>
